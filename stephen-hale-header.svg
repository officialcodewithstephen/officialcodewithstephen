<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Stephen Hale — Software Developer</title>
  <desc id="desc">A dark emerald banner introducing Stephen Hale, a software developer in Norwich, United Kingdom.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07130f"/>
      <stop offset="0.55" stop-color="#0a1d16"/>
      <stop offset="1" stop-color="#103a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e6a1"/>
      <stop offset="1" stop-color="#a2ffd5"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="47%" r="58%">
      <stop offset="0" stop-color="#19bd7b" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#19bd7b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a8f5d2" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 310C215 260 350 365 590 305s399-39 610-113v168H0z" fill="#10b981" opacity="0.055"/>
  <circle cx="1030" cy="64" r="190" fill="none" stroke="#67efb6" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="1030" cy="64" r="153" fill="none" stroke="#67efb6" stroke-opacity="0.08" stroke-width="1"/>

  <rect x="64" y="66" width="4" height="222" rx="2" fill="url(#accent)"/>
  <text x="91" y="91" fill="#8cf0c3" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3">SOFTWARE DEVELOPER  /  NORWICH, UK</text>
  <text x="88" y="169" fill="#f3fff9" font-family="Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" letter-spacing="-2">Stephen Hale</text>
  <text x="91" y="214" fill="#c5e8d8" font-family="Segoe UI, Arial, sans-serif" font-size="21">Building software that matters.</text>
  <text x="91" y="259" fill="#82a997" font-family="Segoe UI, Arial, sans-serif" font-size="14">Developer tools · Infrastructure · Automation · Game technology</text>

  <g transform="translate(724 57)">
    <rect width="406" height="246" rx="17" fill="#07120f" fill-opacity="0.82" stroke="#69dbaa" stroke-opacity="0.27"/>
    <path d="M0 51H406" stroke="#69dbaa" stroke-opacity="0.18"/>
    <circle cx="24" cy="26" r="5" fill="#ff6b6b"/>
    <circle cx="43" cy="26" r="5" fill="#f5c451"/>
    <circle cx="62" cy="26" r="5" fill="#41d69b"/>
    <text x="88" y="30" fill="#86a999" font-family="Consolas, monospace" font-size="11" letter-spacing="1.2">BUILD WITH PURPOSE</text>

    <text x="29" y="91" fill="#76e8b5" font-family="Consolas, monospace" font-size="14">public sealed class Developer</text>
    <text x="29" y="119" fill="#b1cabc" font-family="Consolas, monospace" font-size="14">{</text>
    <text x="51" y="147" fill="#9cdcc0" font-family="Consolas, monospace" font-size="13">string Focus = <tspan fill="#f0d28a">"Useful software"</tspan>;</text>
    <text x="51" y="174" fill="#9cdcc0" font-family="Consolas, monospace" font-size="13">string Principle = <tspan fill="#f0d28a">"Keep it simple"</tspan>;</text>
    <text x="29" y="202" fill="#b1cabc" font-family="Consolas, monospace" font-size="14">}</text>
    <rect x="29" y="218" width="9" height="3" rx="1.5" fill="#35e6a1"/>
    <text x="48" y="224" fill="#648d78" font-family="Consolas, monospace" font-size="11">C#  ·  .NET  ·  SYSTEMS</text>
  </g>

  <path d="M64 327H1136" stroke="#8bf0c2" stroke-opacity="0.18"/>
  <text x="64" y="346" fill="#719483" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">CODEWITHSTEPHEN</text>
  <text x="1136" y="346" text-anchor="end" fill="#719483" font-family="Segoe UI, Arial, sans-serif" font-size="10" letter-spacing="1.5">DESIGN · BUILD · UNDERSTAND</text>
</svg>
